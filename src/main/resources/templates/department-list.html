<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments and Employees</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #2196F3;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            color: #2196F3;
        }

        .dropdown select {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f9f9f9;
            transition: all 0.3s ease;
        }

        .dropdown select:hover {
            border-color: #2196F3;
        }

        .table-wrapper {
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2196F3;
            color: white;
            font-size: 14px;
        }

        td {
            background-color: #f9f9f9;
        }

        tr:hover td {
            background-color: #e0f7fa;
        }

        h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }

        @media screen and (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            h1 {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Department List</h1>
            <div class="dropdown">
                <form th:action="@{/departments}" method="get">
                    <select name="departmentId" onchange="this.form.submit()">
                        <option value="" disabled selected>Select Department</option>
                        <option th:each="department : ${departments}" th:value="${department.id}"
                                th:text="${department.name}"
                                th:selected="${department.id == selectedDepartmentId}"></option>
                    </select>
                </form>
            </div>
        </div>

        <div th:if="${employees != null}" class="table-wrapper">
            <h2>Employees in Selected Department</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="employee : ${employees}">
                        <td th:text="${employee.id}"></td>
                        <td th:text="${employee.name}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
